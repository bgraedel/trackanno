[project]
name = "trackanno"
version = "0.1.0"
description = "Track-clip annotation pipeline: tiled YOLO detection/tracking -> cropped clip cache -> PyQt annotation GUI -> labelled overlay movies"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tifffile>=2024.1.30",
    "nd2>=0.10.1",
    "imagecodecs>=2024.1.1",
    "pandas>=2.0",
    "pyarrow>=15.0",
    # Imported directly: `ShortTimeFFT` in wavespectra, `splprep`/`splev` in
    # kymograph. scikit-learn happens to pull it in too - declare it anyway, or
    # the app depends on a transitive dependency it does not control.
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "imageio[ffmpeg]>=2.34",
    "tqdm>=4.66",
    "ultralytics>=8.3",
    "torch>=2.2",
    "torchvision>=0.17",
    # qtpy is a shim over whichever binding is installed; name the binding
    # explicitly, since it used to arrive only as a side effect of ndv[qt].
    "qtpy>=2.4",
    "PyQt6>=6.6",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    # The suggester's default estimator. Weights the loss by inverse class
    # frequency and splits on NaN natively, both of which this data needs;
    # suggest.model: hist falls back to sklearn without it.
    "catboost>=1.2",
    # ByteTrack's linear assignment. Ultralytics pip-installs this at runtime if
    # it is absent, which uv sync then prunes again - pin it so the environment
    # stays reproducible and no run mutates its own venv mid-flight.
    "lap>=0.5.12",
]

[dependency-groups]
# Installed by a plain `uv sync`; `uv sync --no-dev` leaves it out.
dev = ["pytest>=8"]

[project.optional-dependencies]
# The GPU backend is chosen at INSTALL time, because torch ships one wheel per
# backend rather than loading one at runtime. Pick with the extra, not with
# `--with`, which installs a package rather than selecting an extra:
#
#     uv tool install "trackanno[cuda]"      NVIDIA, Linux and Windows
#     uv tool install "trackanno[mps]"       Apple Silicon
#     uv tool install trackanno              CPU
#
# `mps` resolves to the ordinary PyPI wheel, which on macOS arm64 already
# carries Metal support; the marker keeps it from claiming anything elsewhere.
# Either way `detection.device: auto` picks CUDA, then MPS, then the CPU, so a
# config stays portable between machines.
cuda = [
    "torch>=2.2; sys_platform != 'darwin'",
    "torchvision>=0.17; sys_platform != 'darwin'",
]
mps = [
    "torch>=2.2; sys_platform == 'darwin'",
    "torchvision>=0.17; sys_platform == 'darwin'",
]
# `uv sync --extra sleap` adds the optional SLEAP .h5 export (keypoint-MoSeq compatibility).
sleap = ["sleap-io>=0.1"]

[project.scripts]
# `uv tool install .` puts `trackanno` on PATH; that one command IS the app.
# Kept a console script rather than a gui-script on purpose: a silent failure is
# worse than a terminal window, and the long jobs print useful progress.
trackanno = "trackanno.gui.hub:main"
trackanno-prepare = "trackanno.prepare:main"
trackanno-annotate = "trackanno.gui.app:main"
trackanno-render = "trackanno.render:main"
trackanno-suggest = "trackanno.suggest:main"
trackanno-predict = "trackanno.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackanno"]

# ---------------------------------------------------------------------------
# ultralytics depends on `opencv-python`, which ships its own bundled Qt plugins
# and fights with PyQt6 at startup ("could not find the Qt platform plugin").
# The impossible marker below removes it from the resolution entirely; we depend
# on `opencv-python-headless` instead, which provides the same `cv2` module.
# ---------------------------------------------------------------------------
[tool.uv]
override-dependencies = ["opencv-python; python_version < '3.0'"]

# The two GPU extras must resolve to different torch builds, so declare them in
# conflict: without this the lock pins one torch for every platform and extra,
# and the +cu124 build it picks has no macOS wheel, which breaks a plain install
# on a Mac before any extra is asked for.
conflicts = [[{ extra = "cuda" }, { extra = "mps" }]]

# Only the cuda extra is redirected, and only off macOS: the cu124 index
# publishes no macOS wheels, so without the marker `[cuda]` on a Mac fails to
# resolve instead of falling back.
[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# ---------------------------------------------------------------------------
# The suites are ordinary pytest modules, but most of a suite's value is in the
# NAMED claims inside a test (see tests/harness.py), so a run reports checks as
# well as tests. `-p no:cacheprovider` keeps .pytest_cache out of the tree.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
