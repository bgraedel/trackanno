[project]
name = "trackanno"
version = "0.1.0"
description = "Track-clip annotation pipeline: tiled YOLO detection/tracking -> cropped clip cache -> PyQt/ndv annotation GUI -> labelled overlay movies"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tifffile>=2024.1.30",
    "nd2>=0.10.1",
    "imagecodecs>=2024.1.1",
    "pandas>=2.0",
    "pyarrow>=15.0",
    # Imported directly: `ShortTimeFFT` in wavespectra, `splprep`/`splev` in
    # kymograph. scikit-learn happens to pull it in too - declare it anyway, or
    # the app depends on a transitive dependency it does not control.
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "imageio[ffmpeg]>=2.34",
    "tqdm>=4.66",
    "ultralytics>=8.3",
    "torch>=2.2",
    "torchvision>=0.17",
    "ndv[qt,vispy]>=0.3",
    "qtpy>=2.4",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    # ByteTrack's linear assignment. Ultralytics pip-installs this at runtime if
    # it is absent, which uv sync then prunes again - pin it so the environment
    # stays reproducible and no run mutates its own venv mid-flight.
    "lap>=0.5.12",
]

[dependency-groups]
# Installed by a plain `uv sync`; `uv sync --no-dev` leaves it out.
dev = ["pytest>=8"]

[project.optional-dependencies]
# `uv sync --extra catboost` enables suggest.model: catboost (~100 MB); the
# default sklearn HistGradientBoosting needs nothing extra.
catboost = [
    "catboost>=1.2",
]
# `uv sync --extra cuda` pulls CUDA wheels instead of the CPU-only default.
cuda = ["torch>=2.2", "torchvision>=0.17"]
# `uv sync --extra sleap` adds the optional SLEAP .h5 export (keypoint-MoSeq compatibility).
sleap = ["sleap-io>=0.1"]

[project.scripts]
# `uv tool install .` puts `trackanno` on PATH; that one command IS the app.
# Kept a console script rather than a gui-script on purpose: a silent failure is
# worse than a terminal window, and the long jobs print useful progress.
trackanno = "trackanno.gui.hub:main"
trackanno-prepare = "trackanno.prepare:main"
trackanno-annotate = "trackanno.gui.app:main"
trackanno-render = "trackanno.render:main"
trackanno-suggest = "trackanno.suggest:main"
trackanno-predict = "trackanno.predict:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackanno"]

# ---------------------------------------------------------------------------
# ultralytics depends on `opencv-python`, which ships its own bundled Qt plugins
# and fights with PyQt6 at startup ("could not find the Qt platform plugin").
# The impossible marker below removes it from the resolution entirely; we depend
# on `opencv-python-headless` instead, which provides the same `cv2` module.
# ---------------------------------------------------------------------------
[tool.uv]
override-dependencies = ["opencv-python; python_version < '3.0'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", extra = "cuda" }]
torchvision = [{ index = "pytorch-cuda", extra = "cuda" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

# ---------------------------------------------------------------------------
# The suites are ordinary pytest modules, but most of a suite's value is in the
# NAMED claims inside a test (see tests/harness.py), so a run reports checks as
# well as tests. `-p no:cacheprovider` keeps .pytest_cache out of the tree.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
