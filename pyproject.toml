[project]
name = "trackanno"
version = "0.1.0"
description = "Track-clip annotation pipeline: tiled YOLO detection/tracking -> cropped clip cache -> PyQt annotation GUI -> labelled overlay movies"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
    "tifffile>=2024.1.30",
    "nd2>=0.10.1",
    "imagecodecs>=2024.1.1",
    "pandas>=2.0",
    "pyarrow>=15.0",
    # Imported directly: splines in wavespectra and kymograph, filters in
    # instantaneous. scikit-learn happens to pull it in too - declare it anyway, or
    # the app depends on a transitive dependency it does not control.
    "scipy>=1.11",
    "opencv-python-headless>=4.9",
    "imageio[ffmpeg]>=2.34",
    "tqdm>=4.66",
    # 8.4 for the TRACKTRACK tracker, which tracking.backend defaults to, and
    # for the tracker __init__(args) / update(results, img) signature.
    "ultralytics>=8.4",
    "torch>=2.2",
    "torchvision>=0.17",
    # qtpy is a shim over whichever binding is installed; name the binding
    # explicitly, since it used to arrive only as a side effect of ndv[qt].
    "qtpy>=2.4",
    "PyQt6>=6.6",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    # The suggester's default estimator. Weights the loss by inverse class
    # frequency and splits on NaN natively, both of which this data needs;
    # suggest.model: hist falls back to sklearn without it.
    "catboost>=1.2",
    # ByteTrack's linear assignment. Ultralytics pip-installs this at runtime if
    # it is absent, which uv sync then prunes again - pin it so the environment
    # stays reproducible and no run mutates its own venv mid-flight.
    "lap>=0.5.12",
]

[dependency-groups]
# Installed by a plain `uv sync`; `uv sync --no-dev` leaves it out.
dev = ["pytest>=8"]

[project.optional-dependencies]
# `detection.device: auto` picks CUDA, then MPS, then the CPU at RUNTIME, and a
# CUDA-enabled torch runs perfectly on a machine with no GPU. So a plain install
# is already right nearly everywhere:
#
#     uv tool install trackanno              Linux -> CUDA, macOS -> MPS, Windows -> CPU
#     uv tool install "trackanno[cuda]"      Windows only, where it is the ONLY route to a GPU
#     uv tool install "trackanno[cpu]"       Linux, to skip ~2-3 GB of nvidia wheels
#
# The extras exist for the two cases the default gets wrong, and no others.
# Windows: the PyPI wheel is 122 MB and CPU-only, so CUDA has to come from
# PyTorch's own index. Linux: the PyPI wheel already pulls the CUDA runtime as
# ordinary dependencies (nvidia-*, cuda-toolkit, triton), which is right on a GPU
# box and multiple gigabytes of nothing on the laptop that only cuts clips.
#
# There is no `mps` extra: on macOS the ordinary PyPI wheel already carries
# Metal, so an extra selecting it changed nothing.
cuda = [
    "torch>=2.2; sys_platform == 'win32'",
    "torchvision>=0.17; sys_platform == 'win32'",
]
cpu = [
    "torch>=2.2",
    "torchvision>=0.17",
]
# centerline.enabled: the centerline model's backbone. The centerline code itself is
# found at centerline.code, or installed next to trackanno.
centerline = ["timm>=1.0.15"]

[project.scripts]
# `uv tool install .` puts `trackanno` on PATH; that one command IS the app.
# Kept a console script rather than a gui-script on purpose: a silent failure is
# worse than a terminal window, and the long jobs print useful progress.
trackanno = "trackanno.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackanno"]

# ---------------------------------------------------------------------------
# ultralytics depends on `opencv-python`, which ships its own bundled Qt plugins
# and fights with PyQt6 at startup ("could not find the Qt platform plugin").
# The impossible marker below removes it from the resolution entirely; we depend
# on `opencv-python-headless` instead, which provides the same `cv2` module.
# ---------------------------------------------------------------------------
[tool.uv]
override-dependencies = ["opencv-python; python_version < '3.0'"]

# The two extras resolve to different torch builds, so declare them in conflict:
# without this the lock pins one torch for every extra, and neither index
# publishes macOS wheels, which would break a plain install on a Mac before any
# extra is asked for.
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]

# Each extra is redirected only where it means anything: cuda on Windows, which
# is the one platform whose PyPI wheel has no CUDA in it, and cpu wherever
# somebody asks for the small install. Everywhere else the default PyPI wheel is
# already the right one.
[tool.uv.sources]
torch = [
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
    { index = "pytorch-cuda", extra = "cuda", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", extra = "cpu" },
]

# cu128 rather than the newest: CUDA 12.8 runs on an older driver than CUDA 13
# does, and a shared GPU box is not always on the current driver. Bump this to
# cu130 when yours is. NOT cu124 - that channel stopped at torch 2.6.0 while
# PyPI is many versions past it, so pinning it froze the whole install.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# `-p no:cacheprovider` keeps .pytest_cache out of the tree.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
