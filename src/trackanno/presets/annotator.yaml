# trackanno preset: the keys under `set` override the packaged default_config.yaml.
name: annotator
order: 1
summary: Detect, cut clips, label them by hand. No model beyond the detector.
about: >
  Hand annotation only: detection cuts the clips, one keypress labels each, and
  export draws the labels on the movies. Works with a plain box detector.
set:
  suggest.enabled: false
