# trackanno preset: the keys under `set` override the packaged default_config.yaml.
name: dense bouts
order: 3
summary: Every frame scored on 25-frame windows stepped by 5, decoded into bouts.
about: >
  The suggester preset plus dense prediction: 25-frame windows every 5 frames,
  with bouts shorter than 10 frames merged into a neighbour. The window length is
  clips.frames, so clips are 25 frames too.
set:
  clips.frames: 25             # the window for annotation and dense prediction
  clips.stride: 25
  clips.min_clip_frames: 20    # 80% of the window, as in the default
  detection.task: pose
  suggest.enabled: true
  suggest.feature_groups: [kinematic, pose, waveform]
  render.show_skeleton: true
  predict.window_stride: 5     # overlapping windows, 5 frames apart
  predict.min_bout_frames: 10
