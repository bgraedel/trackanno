# trackanno preset: the keys under `set` override the packaged default_config.yaml.
name: suggester
order: 2
summary: Keypoint detection, and the CatBoost suggester trained on your labels.
about: >
  Pose detection adds shape, beat and waveform features, and a classifier trained
  on your labels suggests a category beside each clip. Needs pose weights.
set:
  detection.task: pose
  suggest.enabled: true
  suggest.feature_groups: [kinematic, pose, waveform, beat]
  render.show_skeleton: true
