# =============================================================================
# trackanno project configuration
# The Configure page keeps these comments. Paths are relative to this file.
# =============================================================================

paths:
  video_dir: "./videos"       # folder holding the movies (.tif, .tiff, .nd2)
  model: "./best.pt"          # YOLO weights used for detection
  work_dir: "./work"          # clip cache and per-movie tables; keep it on a local disk
  csv: "./annotations.csv"    # the annotation log, one row per labelled clip
  patterns: ["*.tif", "*.tiff", "*.nd2"]  # which files in the video folder are movies


# --- ND2 reading: one 2D time series per position ----------------------------
nd2:
  channel: 0          # channel index, or its name (e.g. "BF")
  z: 0                # z index, or max | mean | min for a projection
  positions: all      # all, or a list like [0, 2, 5]; each is a movie
  fps: auto           # frame rate; auto reads it from the file


# --- TIFF reading -------------------------------------------------------------
tiff:
  fps: 100            # acquisition frame rate; TIFF does not record it
  channel: 0          # channel index


# --- Raw to 8-bit intensity ---------------------------------------------------
normalize:
  mode: per_frame     # per_frame: a mapping per frame | fixed: one per movie
  percentiles: [0.5, 99.5]  # percentiles mapped to 0 and 255


# --- Detection ---------------------------------------------------------------
detection:
  task: detect        # pose (keypoints) | detect (boxes only)
  conf: 0.25          # minimum detection confidence
  device: auto        # auto | cpu | mps | a CUDA index such as "0"
  batch: 8            # tiles per forward pass; lower it if the GPU runs out of memory
  imgsz: 640          # resolution each tile is seen at; match the model's training size
  half: false         # fp16 inference on a GPU


# --- Detection model ----------------------------------------------------------
# Empty source uses paths.model. Otherwise a registry id or an https URL to a
# .pt; sha256 is filled in on the first fetch and pins the weights.
model:
  source: ""
  version: ""
  sha256: ""


# --- Tiled inference ----------------------------------------------------------
tiling:
  enabled: auto       # auto tiles only frames larger than one tile | true | false
  tile: 640           # tile size cut from the frame, in pixels
  overlap: 0.25       # fraction of a tile that overlaps its neighbour
  merge_iou: 0.6      # boxes from two tiles overlapping more than this are one animal


# --- Tracking ----------------------------------------------------------------
tracking:
  backend: tracktrack       # tracktrack | bytetrack | botsort | ocsort | deepocsort | fasttrack | greedy
  min_track_length: 40      # drop tracks seen in fewer frames than this
  border_margin_px: 0       # pixels from the edge that count as at it; 0 is off
  border_max_frac: 0.0      # fraction of a clip's frames allowed at the edge
  overrides:                # parameters passed to the tracker
    gmc_method: none        # camera-motion compensation; off for a static stage


# --- Keypoints (detection.task: pose); the order must match the model ---------
keypoints:
  nodes: []           # keypoint names, in the model's order
  edges: []           # skeleton links, drawn on screen only


# --- Clips -------------------------------------------------------------------
clips:
  frames: 50          # frames per clip; also the window the model is fitted at
  stride: 50          # frames between clip starts; equal to frames tiles
  window_mode: all    # first | first_per_track | all
  follow: smooth      # how the crop follows the animal: smooth | fixed | track
  pad: 1.6            # crop side is the box extent times this
  crop_size: auto     # cache crop size; auto is the p99 of what is needed
  min_clip_frames: 40 # detected frames a window needs to become a clip


# --- Detector embeddings, saved during detection ------------------------------
features:
  enabled: true       # save detector embeddings during detection


# --- Beat spectrum ------------------------------------------------------------
spectral:
  window: 75          # frames the beat spectrum is measured over, centred on the clip


# --- Annotation suggestions ---------------------------------------------------
# A classifier trained on your labels suggests a category; it never pre-selects.
suggest:
  enabled: true         # show what a classifier trained on your labels predicts
  model: catboost       # catboost | hist (scikit-learn HistGradientBoosting)
  device: cpu           # where CatBoost fits: cpu | gpu | auto
  # Feature families the model may use: kinematic | pose | waveform | context | emb_<name>
  feature_groups: [kinematic, pose, waveform]
  # Embedding inputs, e.g. {name: det, source: detector} or
  # {name: ae, source: file, path: embeddings/{movie_id}.parquet}
  embeddings: []
  context_frames: 0     # frames of kinematic context around each window; 0 is off
  feature_columns: null # narrow the groups to these columns; null keeps every column
  retrain_every: 10     # refit in the background after this many new labels
  min_per_class: 5      # a class with fewer labels is not modelled
  audit_fraction: 0.10  # fraction of tracks held out to measure agreement
  min_confidence: 0.0   # hide suggestions below this confidence
  select_rule: "off"    # off keeps the shuffle | margin: least certain clips first
  iterations: 1000      # boosting rounds per fit
  learning_rate: auto   # boosting step size; auto lets the estimator choose
  l2_leaf_reg: 3.0      # L2 regularisation of the leaf values


# --- Bulk labelling (trackanno predict) ---------------------------------------
predict:
  window_stride: auto   # frames between window starts; auto is clips.frames
  min_bout_frames: 0    # shorter bouts join a neighbour; 0 keeps every run
  min_frames: 2         # detections a window needs to be featurised


# --- Annotation categories ----------------------------------------------------
# Each group is a block of buttons; `key` is its shortcut, `color` is used on
# screen and in rendered movies. Replace these placeholders.
categories:
  - name: behaviour
    type: single          # single = one choice | multi = checkboxes
    required: true        # auto-advance waits until every required group is set
    options:
      - {name: swimming, key: "1", color: "#4C9F70"}
      - {name: immotile, key: "2", color: "#D95F02"}
      - {name: unclear,  key: "3", color: "#7570B3"}

  - name: quality
    type: multi
    required: false
    options:
      - {name: blurry,       key: "q", color: "#999999"}
      - {name: occluded,     key: "w", color: "#777777"}
      - {name: track_switch, key: "e", color: "#BB2222"}


# --- Annotation window --------------------------------------------------------
ui:
  theme: dark           # dark | light | system; applies on next start
  fps: 20               # playback rate in the annotation window
  auto_advance: true    # one keypress labels the clip and moves on
  shuffle: true         # annotate in a seeded random order
  annotator: ""         # written into every row of the CSV
  kymo_sign: canonical  # canonical: flip each kymograph to its dominant sign | raw

# Keyboard shortcuts. Category keys are set per option above.
keys:
  next: ["Right", "Return"]
  prev: ["Left"]
  next_unannotated: ["Tab"]
  play_pause: ["Space"]
  overlay: ["o"]
  stabilise: ["s"]
  context: ["c"]
  zoom_in: ["+", "="]
  zoom_out: ["-"]
  zoom_reset: ["0"]
  uncertain: ["u"]
  notes: ["n"]
  clear: ["Backspace"]
  undo: ["Ctrl+Z"]


# --- Overlay movies -----------------------------------------------------------
render:
  fps: auto             # frame rate of the movie; auto is the source rate
  out_dir: "./renders"  # where overlay movies are written
  hide_unlabelled: false  # draw only tracks that carry a label
  show_skeleton: false  # draw pose keypoints
